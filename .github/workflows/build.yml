name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Installation de FFmpeg (tests vidéo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests de la bibliothèque
        run: dotnet test tests/AllInOne.Core.Tests -c Release

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests (Windows)
        run: dotnet test tests/AllInOne.Core.Tests -c Release
      - name: Publication (application + ligne de commande, DLL à côté des exe)
        run: |
          dotnet publish src/AllInOne.App -c Release -r win-x64 --self-contained false -p:DebugType=none -o publish
          dotnet publish src/AllInOne.Cli -c Release -r win-x64 --self-contained false -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: AllInOne-win-x64
          path: publish/
